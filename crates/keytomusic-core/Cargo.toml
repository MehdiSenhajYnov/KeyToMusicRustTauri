[package]
name = "keytomusic-core"
version = "1.1.0"
description = "KeyToMusic engine shared by the Tauri and native front-ends"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rodio = "0.19"
cpal = "0.15"
symphonia = { version = "0.5", features = ["mp3", "flac", "ogg", "wav", "pcm", "aac", "isomp4"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "process", "io-util", "time", "macros"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
futures = "0.3"
regex = "1"
rayon = "1.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"
image = { version = "0.25", features = ["jpeg", "png", "webp"] }
base64 = "0.22"
axum = "0.8"
flate2 = "1"
tar = "0.4"
tempfile = "3"

[target."cfg(not(any(target_os = \"macos\", target_os = \"windows\")))".dependencies]
# Use RustDesk's fork of rdev for Linux
rdev = { git = "https://github.com/fufesou/rdev", branch = "master" }

[target."cfg(target_os = \"linux\")".dependencies]
evdev = "0.13.2"

[target."cfg(target_os = \"windows\")".dependencies]
# Use Windows API directly for keyboard input (Raw Input API for global key capture)
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Graphics_Gdi"
] }

[dev-dependencies]
tracing-log = "0.2"
rand = "0.8"
